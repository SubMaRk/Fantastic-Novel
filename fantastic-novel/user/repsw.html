{header:header/page.html}
{header:header/main.js.html}
{header:header/main.css.html}
<link rel="stylesheet" href="{templates}/static/css/main.index.css">
{header:global.body.html}
{header:novel/nav.html}
<section id="page">
  <div class="container" id="gb_w">
    <div class="row">
      <div class="col s12 m8 l6 offset-m2 offset-l3">
        <div class="text_block z-depth-3" data-aos="fade-up">
          <h5><i class="fa fa-lock"></i> ตั้งรหัสผ่านใหม่</h5>
        </div>
        <div class="card z-depth-3">
          <div class="card-content">
            <form action="{表单提交地址}" method="post">
              {隐藏表单}
              <div class="input-field">
                <input type="password" name="psw" id="psw" required>
                <label for="psw">รหัสผ่านใหม่</label>
              </div>
              <div class="input-field">
                <input type="password" name="repsw" id="repsw" required>
                <label for="repsw">ยืนยันรหัสผ่านใหม่</label>
              </div>
              <button class="btn waves-effect waves-light" type="submit">บันทึกรหัสผ่าน</button>
              <a class="btn-flat" href="{登录}">กลับไปเข้าสู่ระบบ</a>
            </form>
          </div>
        </div>
        <p class="center grey-text">รหัสผ่านต้องยาว 8 ตัวอักษรขึ้นไป</p>
      </div>
    </div>
  </div>
</section>
{header:footer.global.html}
