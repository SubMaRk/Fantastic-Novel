<!-- Load Header -->
{header:header/page.html}
<!-- Load Functions Script -->
{header:header/main.js.html}
{header:header/main.css.html}
<link rel="stylesheet" href="{templates}/static/css/main.index.css">
<!-- Load Global body -->
{header:global.body.html}
<!-- Load Global Nav -->
{header:novel/nav.html}
<section id="diy">
  <div class="container" id="gb_w">
    <div class="row">
      <div class="col s12 l9" id="content">
        <div class="text_block z-depth-3" data-aos="fade-up" data-aos-duration="500" data-aos-delay="300">
          <h5>{名字} <i class="fa far-eye"></i></h5>
        </div>
        <div class="card z-depth-3" data-aos="fade-up" data-aos-duration="500" data-aos-delay="400">
          <div class="card-content">
            <p>
              <i class="fa fal-clock"></i> <span>{发布时间:n-y-r}</span>
            </p>
          </div>
        </div>
        <div class="card z-depth-3" data-aos="zoom-in-up" data-aos-duration="500" data-aos-delay="500">
          <div class="card-content">
            {内容}
          </div>
        </div>
      </div>
      <div class="col s12 l3 left" id="category">
        <div class="text_block z-depth-3" data-aos="fade-up" data-aos-duration="500" data-aos-delay="300">
          <h5>หน้าเว็บอื่น ๆ</h5>
        </div>
        <div class="collection z-depth-3" data-aos="zoom-in-up" data-aos-duration="500" data-aos-delay="500">
          {单页:数量=10;排序=时间}
          <a href="{url}" target="_self" class="collection-item" title="{单页名字}">{单页名字}</a>
          {无数据}<p class="center">ยังไม่มีหน้าเว็บ</p>{/无数据}
          {/单页}
        </div>
      </div>
    </div>
  </div>
</section>
<!-- Load Global Footer -->
{header:footer.global.html}
