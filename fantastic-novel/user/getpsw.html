{header:header/page.html}
{header:header/main.js.html}
{header:header/main.css.html}
<link rel="stylesheet" href="{templates}/static/css/main.index.css">
{header:global.body.html}
{header:novel/nav.html}
<section id="page">
  <div class="container" id="gb_w">
    <div class="row">
      <div class="col s12 m8 l6 offset-m2 offset-l3">
        <div class="text_block z-depth-3" data-aos="fade-up">
          <h5><i class="fa fa-key"></i> กู้คืนบัญชี</h5>
        </div>
        <div class="card z-depth-3">
          <div class="card-content">
            <form action="{表单提交地址}" method="post">
              <div class="input-field">
                <input type="text" name="name" id="name" required>
                <label for="name">ชื่อผู้ใช้</label>
              </div>
              <div class="input-field">
                <input type="text" name="email" id="email" required>
                <label for="email">อีเมลที่ใช้สมัคร</label>
              </div>
              {找回密码验证码开启}
              <div class="input-field">
                <input type="text" name="code" id="code" inputmode="numeric" required>
                <label for="code">รหัสยืนยัน</label>
              </div>
              <div class="center" style="margin-bottom:20px;">{找回密码验证码}</div>
              {/找回密码验证码开启}
              <button class="btn waves-effect waves-light" type="submit">ส่งคำขอกู้คืน</button>
              <a class="btn-flat" href="{登录}">กลับไปเข้าสู่ระบบ</a>
            </form>
          </div>
        </div>
        <p class="center grey-text">ระบบจะส่งลิงก์ตั้งรหัสผ่านใหม่ไปที่อีเมลที่ลงทะเบียนไว้</p>
      </div>
    </div>
  </div>
</section>
{header:footer.global.html}
